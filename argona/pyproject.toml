[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argona"
version = "1.0.0"
description = "ARGONA - autonomous prediction-market intelligence & trading system (paper-first)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "cryptography>=42",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
llm = ["anthropic>=0.40"]
# Polymarket live order signing (official SDK). Only needed for LIVE trading on Polymarket.
polymarket-live = ["polymarket-client>=0.13"]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
argona = "argona.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
"argona.migrations" = ["script.py.mako", "*.py", "versions/*.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["backend"]
filterwarnings = ["ignore::DeprecationWarning"]
