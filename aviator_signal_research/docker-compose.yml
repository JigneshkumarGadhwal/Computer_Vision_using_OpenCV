services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      AVR_CORS_ORIGINS: "http://localhost:8080"
    volumes:
      - ./data:/srv/data
      - ./reports:/srv/reports
    ports:
      - "8000:8000"
  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
